<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Cours IA</title>
    <style>
        :root {
            --bg-color: #f0fdf4; /* Vert très clair */
            --container-bg: #ffffff;
            --primary: #059669; /* Vert Émeraude */
            --primary-hover: #047857;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border: #d1d5db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(5, 150, 105, 0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            color: var(--primary);
        }
        p {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background-color: #ecfdf5;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upload-area:hover {
            background-color: #d1fae5;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #6ee7b7; cursor: not-allowed; }
        
        .output-container {
            margin-top: 20px;
            display: none;
        }
        /* Style pour simuler une vraie feuille de cours */
        #result {
            width: 100%;
            height: 400px;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: "Georgia", serif;
            font-size: 15px;
            line-height: 1.8;
            background-color: #fff;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        #statusInfo {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .secondary-btn {
            background-color: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .secondary-btn:hover {
            background-color: #ecfdf5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🟢 Architecte de Cours IA</h1>
        <p>Importe ton lourd document de transcription brut (.txt). L'IA va analyser l'intégralité du texte pour construire un cours structuré, organisé et mis en forme pour tes révisions.</p>

        <div class="form-group">
            <label for="apiKey">Clé API Groq (commence par gsk_) :</label>
            <input type="password" id="apiKey" placeholder="gsk_...">
        </div>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('textFile').click()">
            <input type="file" id="textFile" accept=".txt, .md" style="display:none">
            <div style="font-size: 28px; margin-bottom: 10px;">📄</div>
            <strong id="fileName">Clique ici pour ajouter ton fichier de transcription (.txt)</strong>
        </div>

        <button id="generateBtn" disabled>🪄 Transformer en cours structuré</button>
        
        <div id="statusInfo"></div>
        
        <div class="output-container" id="outputContainer">
            <label>Ton cours structuré :</label>
            <div id="result" contenteditable="true"></div>
            <button id="downloadBtn" class="secondary-btn" style="margin-top: 15px;">⬇️ Télécharger le cours (.txt)</button>
        </div>
    </div>

    <script>
        const textFileInput = document.getElementById('textFile');
        const generateBtn = document.getElementById('generateBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const resultArea = document.getElementById('result');
        const statusInfo = document.getElementById('statusInfo');
        const outputContainer = document.getElementById('outputContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileNameDisplay = document.getElementById('fileName');
        
        let fileContent = "";

        textFileInput.addEventListener('change', (e) => {
            const selectedFile = e.target.files[0];
            if (selectedFile) {
                fileNameDisplay.innerHTML = `${selectedFile.name} (Prêt à l'analyse)`;
                
                // Lecture du fichier texte
                const reader = new FileReader();
                reader.onload = function(event) {
                    fileContent = event.target.result;
                    generateBtn.disabled = false;
                };
                reader.readAsText(selectedFile);
            }
        });

        generateBtn.addEventListener('click', async () => {
            const rawKey = apiKeyInput.value;
            const apiKey = rawKey.replace(/[^\x20-\x7E]/g, "").trim();

            if (!apiKey.startsWith("gsk_")) { 
                alert("Il te faut ta clé API Groq pour continuer."); 
                return; 
            }
            if (!fileContent) return;

            generateBtn.style.display = 'none';
            statusInfo.style.display = 'block';
            outputContainer.style.display = 'none';
            resultArea.innerHTML = "";

            try {
                statusInfo.innerHTML = "🧠 L'IA lit et analyse l'intégralité du document (cela prend environ 10 à 20 secondes)...";
                
                // On utilise le modèle doté d'une énorme capacité de mémoire (jusqu'à 128k tokens)
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-70b-versatile',
                        messages: [
                            { 
                                role: 'system', 
                                content: `Tu es un assistant universitaire expert en ingénierie pédagogique. Ton rôle est de transformer une retranscription brute (souvent très longue, sans ponctuation et avec des hésitations) en une véritable fiche de cours, parfaitement structurée pour un étudiant. 
                                Consignes strictes : 
                                1. Dégage un plan logique clair avec un Grand Titre, puis I, II, III (avec des sous-titres A, B, C si nécessaire). 
                                2. Utilise des puces et des tirets pour lister les arguments. 
                                3. Identifie et mets en avant les définitions, théories, et le vocabulaire technique (notamment en commerce, gestion ou marketing). 
                                4. Si la langue de la transcription est l'espagnol, maintiens absolument la rigueur académique espagnole. 
                                5. Supprime toutes les phrases inutiles, les digressions du professeur et les répétitions. Ne garde que le savoir utile, mais sois exhaustif sur le contenu académique.`
                            },
                            { 
                                role: 'user', 
                                content: `Voici la retranscription brute à transformer en cours structuré :\n\n${fileContent}`
                            }
                        ],
                        temperature: 0.3
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const formattedText = data.choices[0].message.content;
                    // Transformation basique du Markdown (gras) en HTML pour l'affichage
                    let htmlText = formattedText
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        .replace(/\n/g, '<br>');
                    
                    resultArea.innerHTML = htmlText;
                    
                    statusInfo.innerHTML = "✅ Cours généré avec succès ! Tu peux modifier le texte directement dans le cadre si tu le souhaites.";
                    statusInfo.style.backgroundColor = "#d1fae5";
                    statusInfo.style.color = "#065f46";
                    outputContainer.style.display = 'block';
                } else {
                    throw new Error(data.error?.message || "Erreur de connexion à l'API.");
                }

            } catch (error) {
                statusInfo.innerHTML = "❌ Erreur : " + error.message;
                statusInfo.style.backgroundColor = "#fee2e2";
                statusInfo.style.color = "#991b1b";
                generateBtn.style.display = 'block';
            }
        });

        downloadBtn.addEventListener('click', () => {
            // On récupère le texte pur (sans les balises HTML) pour le fichier txt
            const textToDownload = resultArea.innerText;
            const blob = new Blob([textToDownload], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Cours_Structure.txt';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
