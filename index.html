<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Cours IA (Illimité)</title>
    <!-- Bibliothèque pour lire les fichiers Word (.docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- Bibliothèque pour lire les fichiers PDF (.pdf) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --bg-color: #f0fdf4;
            --container-bg: #ffffff;
            --primary: #059669;
            --primary-hover: #047857;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border: #d1d5db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(5, 150, 105, 0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            color: var(--primary);
        }
        p {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background-color: #ecfdf5;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upload-area:hover {
            background-color: #d1fae5;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #6ee7b7; cursor: not-allowed; }
        
        .output-container {
            margin-top: 20px;
            display: none;
        }
        #result {
            width: 100%;
            height: 450px;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: "Georgia", serif;
            font-size: 15px;
            line-height: 1.8;
            background-color: #fff;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        #statusInfo {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .secondary-btn {
            background-color: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .secondary-btn:hover {
            background-color: #ecfdf5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🟢 Architecte de Cours IA (Illimité)</h1>
        <p>Importe n'importe quel document (Word, PDF ou TXT), même très long. L'IA découpe et traite l'intégralité du contenu pour créer ta fiche de cours structurée.</p>

        <div class="form-group">
            <label for="apiKey">Clé API Groq (commence par gsk_) :</label>
            <input type="password" id="apiKey" placeholder="gsk_...">
        </div>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('docFile').click()">
            <input type="file" id="docFile" accept=".docx, .pdf, .txt" style="display:none">
            <div style="font-size: 28px; margin-bottom: 10px;">📄</div>
            <strong id="fileName">Clique ici pour ajouter ton document (Word, PDF ou .txt)</strong>
        </div>

        <button id="generateBtn" disabled>🪄 Transformer en cours structuré</button>
        
        <div id="statusInfo"></div>
        
        <div class="output-container" id="outputContainer">
            <label>Ton cours structuré :</label>
            <div id="result" contenteditable="true"></div>
            <button id="downloadBtn" class="secondary-btn" style="margin-top: 15px;">⬇️ Télécharger au format Word (.doc)</button>
        </div>
    </div>

    <script>
        const docFileInput = document.getElementById('docFile');
        const generateBtn = document.getElementById('generateBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const resultArea = document.getElementById('result');
        const statusInfo = document.getElementById('statusInfo');
        const outputContainer = document.getElementById('outputContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileNameDisplay = document.getElementById('fileName');
        
        let fileContent = "";

        // Fonction pour découper le texte propre sans couper de phrases
        function splitTextIntoChunks(text, maxChars = 15000) {
            const paragraphs = text.split("\n");
            const chunks = [];
            let currentChunk = "";

            for (let para of paragraphs) {
                if ((currentChunk + "\n" + para).length > maxChars) {
                    if (currentChunk.trim().length > 0) chunks.push(currentChunk.trim());
                    currentChunk = para;
                } else {
                    currentChunk += (currentChunk ? "\n" : "") + para;
                }
            }
            if (currentChunk.trim().length > 0) chunks.push(currentChunk.trim());
            return chunks.length > 0 ? chunks : [text];
        }

        docFileInput.addEventListener('change', async (e) => {
            const selectedFile = e.target.files[0];
            if (!selectedFile) return;

            const fileName = selectedFile.name.toLowerCase();
            fileNameDisplay.innerHTML = `${selectedFile.name} (Lecture en cours...)`;
            generateBtn.disabled = true;

            try {
                if (fileName.endsWith('.docx')) {
                    const arrayBuffer = await selectedFile.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    fileContent = result.value;
                } 
                else if (fileName.endsWith('.pdf')) {
                    const arrayBuffer = await selectedFile.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                    let extractedText = "";
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        extractedText += pageText + "\n";
                    }
                    fileContent = extractedText;
                }
                else {
                    fileContent = await selectedFile.text();
                }

                fileNameDisplay.innerHTML = `${selectedFile.name} (Prêt à l'analyse)`;
                generateBtn.disabled = false;

            } catch (error) {
                alert("Erreur lors de la lecture du fichier : " + error.message);
                fileNameDisplay.innerHTML = "Clique ici pour ajouter ton document (Word, PDF ou .txt)";
            }
        });

        generateBtn.addEventListener('click', async () => {
            const rawKey = apiKeyInput.value;
            const apiKey = rawKey.replace(/[^\x20-\x7E]/g, "").trim();

            if (!apiKey.startsWith("gsk_")) { 
                alert("Il te faut ta clé API Groq pour continuer."); 
                return; 
            }
            if (!fileContent.trim()) {
                alert("Le fichier est vide ou n'a pas pu être lu.");
                return;
            }

            generateBtn.style.display = 'none';
            statusInfo.style.display = 'block';
            outputContainer.style.display = 'block';
            resultArea.innerHTML = "";

            try {
                // Découpage du document en sections digestes
                const chunks = splitTextIntoChunks(fileContent, 15000);
                
                for (let i = 0; i < chunks.length; i++) {
                    statusInfo.innerHTML = `🧠 Traitement de la partie ${i + 1} sur ${chunks.length}...`;
                    
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'llama-3.1-8b-instant',
                            messages: [
                                { 
                                    role: 'system', 
                                    content: `Tu es un assistant universitaire expert en ingénierie pédagogique. Ton rôle est de transformer cette section de retranscription brute en une fiche de cours parfaitement structurée.
                                    Consignes :
                                    1. Délimite clairement les parties avec des titres et sous-titres.
                                    2. Utilise des puces et des tirets pour lister les concepts importants.
                                    3. Mets en valeur (en gras) les définitions, théories et termes techniques.
                                    4. Garde la même langue que le document d'origine.
                                    5. Supprime les répétitions et hésitations sans perdre de contenu académique.`
                                },
                                { 
                                    role: 'user', 
                                    content: `Voici la partie ${i + 1}/${chunks.length} du document à structurer :\n\n${chunks[i]}`
                                }
                            ],
                            temperature: 0.3
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        const formattedText = data.choices[0].message.content;
                        
                        let htmlText = formattedText
                            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                            .replace(/\*(.*?)\*/g, '<em>$1</em>')
                            .replace(/\n/g, '<br>');
                        
                        if (i > 0) {
                            resultArea.innerHTML += '<hr style="margin: 30px 0; border: 0; border-top: 2px dashed #059669;">';
                        }
                        resultArea.innerHTML += htmlText;
                        resultArea.scrollTop = resultArea.scrollHeight;
                    } else {
                        throw new Error(data.error?.message || "Erreur lors de la réponse de Groq.");
                    }

                    // Petite pause de sécurité entre les requêtes
                    if (i < chunks.length - 1) {
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }

                statusInfo.innerHTML = "✅ Cours complet généré avec succès ! Tu peux relire ou modifier le texte avant d'exporter.";
                statusInfo.style.backgroundColor = "#d1fae5";
                statusInfo.style.color = "#065f46";

            } catch (error) {
                statusInfo.innerHTML = "❌ Erreur : " + error.message;
                statusInfo.style.backgroundColor = "#fee2e2";
                statusInfo.style.color = "#991b1b";
                generateBtn.style.display = 'block';
            }
        });

        // Téléchargement Word
        downloadBtn.addEventListener('click', () => {
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Cours Structuré</title></head><body>";
            const footer = "</body></html>";
            const htmlContent = header + resultArea.innerHTML + footer;
            
            const blob = new Blob(['\ufeff', htmlContent], {
                type: 'application/msword'
            });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Cours_Structure_IA.doc';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
