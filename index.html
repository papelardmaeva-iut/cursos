<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Cours IA</title>
    <!-- Bibliothèque pour lire les fichiers Word (.docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #f0fdf4;
            --container-bg: #ffffff;
            --primary: #059669;
            --primary-hover: #047857;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border: #d1d5db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(5, 150, 105, 0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            color: var(--primary);
        }
        p {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background-color: #ecfdf5;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upload-area:hover {
            background-color: #d1fae5;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #6ee7b7; cursor: not-allowed; }
        
        .output-container {
            margin-top: 20px;
            display: none;
        }
        #result {
            width: 100%;
            height: 400px;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: "Georgia", serif;
            font-size: 15px;
            line-height: 1.8;
            background-color: #fff;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        #statusInfo {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 500;
        }
        .secondary-btn {
            background-color: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .secondary-btn:hover {
            background-color: #ecfdf5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🟢 Architecte de Cours IA</h1>
        <p>Importe ton document (Word ou texte). L'IA va analyser l'intégralité du contenu pour construire un cours structuré et mis en forme pour tes révisions.</p>

        <div class="form-group">
            <label for="apiKey">Clé API Groq (commence par gsk_) :</label>
            <input type="password" id="apiKey" placeholder="gsk_...">
        </div>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('docFile').click()">
            <!-- Accepte désormais les .docx et .txt -->
            <input type="file" id="docFile" accept=".docx, .txt" style="display:none">
            <div style="font-size: 28px; margin-bottom: 10px;">📄</div>
            <strong id="fileName">Clique ici pour ajouter ton document
